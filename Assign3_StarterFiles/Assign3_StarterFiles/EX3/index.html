<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erics Bikes</title>
    <link rel="stylesheet" href="bikes.css">
</head>

<body>
    <h1>Account Sign Up</h1>
    <form action="confirm.html" method="post">
        <label for="name">User Name:</label>
        <input type="text" name="name" id="name" pattern="^[A-Za-z]{5,}$" required autofocus>
        <span></span>
        <br>

        <label for="password_1">Password:</label>
        <input type="text" name="password_1" id="password_1" pattern="^(?=.*[A-Z])(?=.*\d).{8,}$" required>
        <span></span>
        <br>

        <label for="password_2">Re-enter Password:</label>
        <input type="text" name="password_2" id="password_2" pattern="^(?=.*[A-Z])(?=.*\d).{8,}$" required>
        <span></span>
        <br>

        <label></label>
        <input type="submit" id="save" value="Save">
    </form>
    <p id="message"></p>

	<script src="bikes.js"></script>
</body>
</html>
